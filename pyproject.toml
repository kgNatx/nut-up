[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nut-up"
version = "0.1.0"
description = "A modern wrapper around NUT — painless setup, beautiful monitoring"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
nut-up = "nut_up.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nut_up"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
